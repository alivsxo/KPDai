<title>K-POP Dance Vision v2</title>

<style>
/* Reference build look: near-black ground, slim header band, 1680px workspace (video wall + transport + timeline | 540px stage column), tiny bold 10px tinted buttons, rounded-2xl panels. */
:root{
  color-scheme:dark;
  --bg:#05050b; --band:#0a0a15; --card:#0b0b17; --card2:#10101f; --line:#1c1c30; --line2:#2a2a45; --fg:#e6e8f2; --mute:#8a8ea8; --dim:#5d617a;
  --accent:#6366f1; --accent2:#8b5cf6; --pink:#ec4899; --amber:#f59e0b; --ok:#10b981; --bad:#f87171; --cyan:#06b6d4;
  --a:#6366f1; --b:#ec4899;
  --font:'Inter','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --display:'Inter','Noto Sans TC',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:11px;line-height:1.45;margin:0;padding-bottom:28px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0}
/* header band */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px max(20px,env(safe-area-inset-left,0px)) 10px max(20px,env(safe-area-inset-left,0px));background:var(--band);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;box-shadow:0 4px 16px #6366f155;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1{font:700 15px/1.2 var(--display);margin:0;color:#e0e7ff;letter-spacing:.01em}
.brand h1 em{font-style:normal;color:#a5b4fc}
.brand small{display:block;color:var(--dim);font-size:9px;margin-top:1px}
#projName{background:#0e0e1c;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;width:150px;max-width:100%;color:#c7d2fe;font:700 9px var(--font)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
/* tinted bold 10px buttons */
.btn,.b{background:#13132a;border:1px solid var(--line2);color:#c7cbe0;border-radius:8px;padding:6px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:10px;line-height:1.2}
.btn:hover:not(:disabled),.b:hover:not(:disabled){filter:brightness(1.25)}
.btn:disabled,.b:disabled{opacity:.38;cursor:not-allowed}
.btn.on,.b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri,.b.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent}
.b.indigo,.btn.ai{background:#6366f11a;border-color:#6366f166;color:#a5b4fc}
.b.amber,.btn.warn{background:#f59e0b1a;border-color:#f59e0b66;color:#fcd34d}
.b.pink{background:#ec48991a;border-color:#ec489966;color:#f9a8d4}
.b.green{background:#10b9811a;border-color:#10b98166;color:#6ee7b7}
.b.cyan{background:#06b6d41a;border-color:#06b6d466;color:#67e8f9}
.b.violet{background:#8b5cf61f;border-color:#8b5cf688;color:#c4b5fd}
.b.red,.btn.rec{background:#e11d48;border-color:#e11d48;color:#fff}
.b.on.pink{background:#ec489933;border-color:#ec4899;color:#fff}
.b.on.indigo,.b.on.cyan,.b.on.amber,.b.on.green{filter:brightness(1.35)}
.btn.sm{padding:3px 7px;font-size:10px;border-radius:6px}
.jgrp{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.jgrp .b{border:0;border-radius:0;background:transparent;color:#c7cbe0}
.jgrp .b.solid{background:var(--accent);color:#fff}
select,input[type=text],input[type=number],textarea{background:#0e0e1c;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;min-width:0;font-size:10px;font-weight:600;color:#d7dbef}
#selLang{border-radius:8px;padding:5px 8px;font-weight:700}
/* workspace */
.app{display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:16px;align-items:start;max-width:1680px;margin:16px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.theater .app{grid-template-columns:minmax(0,1fr);max-width:none}
.col{min-width:0;display:flex;flex-direction:column;gap:12px}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
.row2 .lab,.lab{color:var(--mute);font-size:10px;font-weight:700;white-space:nowrap}
.nudge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:3px 4px 3px 9px;background:#0b0b1a}
.nudge span{font-size:9px;font-weight:700;color:var(--mute);white-space:nowrap}
.nudge input{width:44px;border:0;background:transparent;padding:2px 2px;font:700 10px var(--mono);text-align:right}
#inSA{color:#67e8f9}#inSB{color:#f9a8d4}
.nudge i{font-style:normal;color:var(--dim);font-size:9px;padding-right:4px}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex-basis:100%;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:#09091400}
.sub .lab.pk{color:#f9a8d4}
.chipset{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:#0e0e1d;color:#aeb2c9;font-size:10px;font-weight:700}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
#resSeg .pill{padding:4px 8px;font-size:9px;border-radius:6px;background:transparent;border-color:transparent;color:var(--mute)}
#resSeg .pill.on{background:#ec489926;border-color:#ec4899;color:#fff}
/* video wall */
.views{display:grid;gap:12px}
.views.l-sbs,.views.l-abs{grid-template-columns:1fr 1fr}
.views.l-tb,.views.l-as,.views.l-bs{grid-template-columns:1fr}
.panel{background:#000;border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden;position:relative}
.panel canvas{display:block;width:100%;height:auto;touch-action:none;background:#000}
#cvA,#cvB{aspect-ratio:16/9}
.phead{position:absolute;left:8px;top:8px;right:8px;display:flex;pointer-events:none;z-index:2}
.phead .nm{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;max-width:75%;background:#0a0a14cc;border:1px solid #ffffff14;border-radius:999px;padding:3px 10px 3px 8px;font-size:9px;font-weight:700;color:#dfe2f2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(4px)}
.phead .nm::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dotc,#6366f1);flex:none}
#pA .phead{--dotc:#6366f1}#pB .phead{--dotc:#ec4899}
.ptools{position:absolute;right:8px;bottom:8px;display:flex;gap:2px;background:#0a0a14d9;border:1px solid #ffffff14;border-radius:8px;padding:3px;z-index:2;backdrop-filter:blur(4px)}
.ptools button{background:none;border:0;border-radius:5px;color:#c7cbe0;font:700 10px var(--font);padding:3px 7px;min-width:24px}
.ptools button:hover{background:#ffffff14}
.panel .ptools{opacity:.3;transition:opacity .15s}.panel .ptools:hover,.panel .ptools:focus-within{opacity:1}@media (hover:none){.panel .ptools:active{opacity:1}}
.ptools button.on{background:var(--accent);color:#fff}
.ptools button.rv{color:#fbbf24}
.ptools .zv{display:none}
/* transport */
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px}
.playbtn{width:36px;height:36px;border-radius:50%;border:0;background:#6366f1;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px #6366f166}
.tlab{font-size:10px;font-weight:700;color:#c7cbe0;white-space:nowrap}
.grp1{display:flex;align-items:center;gap:4px;background:#0a0a16;border:1px solid var(--line);border-radius:8px;padding:3px 5px}
.grp1 .b{padding:3px 7px;border-radius:6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,#6366f1 var(--p,0%),#23233d var(--p,0%));min-width:0;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #6366f1;cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #6366f1}
#rngSeek{flex:1;min-width:90px}
#rngVol{width:70px}
.rate{background:none;border:0;padding:3px 6px;border-radius:5px;color:var(--mute);font:600 10px var(--mono)}
.rate.on{background:var(--ok);color:#fff;font-weight:700}
.timecode{font:600 10px var(--mono);padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:#0a0a16;color:#dfe2f2}
.ico{background:none;border:0;padding:0 2px;font-size:12px}
/* timeline */
.tl{padding:10px 12px}
.tlhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px;color:var(--mute);font-size:10px}
.tlhead b{color:#e6e8f2;font-size:10px;font-weight:700}
.tlhead .tt1{font:600 9px var(--mono);color:#67e8f9}
.tl canvas{display:block;width:100%;height:108px;touch-action:none;cursor:default}
.tl.collapsed canvas{display:none}
.hint{color:var(--mute);font-size:10px}
.beatbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px}
.beatbar canvas{width:140px;height:34px;background:#08081300;border:1px solid var(--line);border-radius:8px}
.nbtn{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:#0e0e1d;font:700 10px var(--mono);padding:0;color:#aeb2c9}
.nbtn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.nbtn.cur{box-shadow:0 0 0 3px #ec489966}
.numin{width:60px;font-family:var(--mono)}
/* right column */
.rfoot{border-top:1px solid var(--line);padding:10px 12px 12px}
.rhead{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.b.sm2{padding:4px 7px;min-width:0;font-size:11px;background:#1b1f3a;border:1px solid var(--line);color:#c7d2fe}
.rseg{flex:1;display:flex;background:#08081300;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.rseg button{flex:1;border:0;border-radius:7px;background:transparent;color:var(--mute);padding:6px 8px;font:700 10px var(--font)}
.rseg button.on{background:var(--accent);color:#fff}
.scsw{display:inline-flex;flex:0 0 auto;align-items:center;gap:4px;font:700 11px var(--font);color:var(--mute);padding:0 4px;white-space:nowrap}.scsw.dis{opacity:.45}
#scoreWrap{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);overflow:auto;padding:2px}
.sccard{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0c0e1a;display:flex;flex-direction:column;gap:6px;font-size:12px}
.sccard .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sccard label{color:var(--mute);font-weight:700}.sccard select{max-width:180px}
.sccard h3,.sccard p{margin:0}.sccard.lock ul{margin:0;padding-left:18px;color:var(--mute)}.sccard.warn{border-color:#f59e0b;color:#fde68a}
.sccard .pro{font:800 9px var(--font);background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;border-radius:6px;padding:2px 6px}
.wts label{display:flex;align-items:center;gap:4px}.wts input{width:70px}
.sctot{display:flex;gap:12px;align-items:center}.sctot .big{font:900 38px Inter,sans-serif;min-width:86px;text-align:center}.sctot .big small{font-size:18px;margin-left:4px}.sctot .grow{flex:1}
.scbar{display:flex;align-items:center;gap:6px}.scbar span{width:52px;color:var(--mute)}.scbar i{flex:1;height:7px;background:#1e2235;border-radius:4px;overflow:hidden}.scbar i b{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899)}.scbar em{width:28px;text-align:right;font-style:normal;font-weight:800}
.scdan{display:flex;flex-wrap:wrap;gap:4px}.scdan span{border:1px solid;border-radius:8px;padding:2px 6px}.scdan.sm span{font-size:10px;padding:1px 4px}
.scsegs{display:flex;flex-direction:column;gap:4px}.scseg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;border-radius:8px;background:#11142a;cursor:pointer}.scseg:hover,.scseg.on{outline:1px solid var(--accent)}
.scseg .sw{width:8px;height:26px;border-radius:3px}.scseg .nm{display:flex;flex-direction:column;min-width:90px;font-weight:700}.scseg small{color:var(--mute)}.scseg>small{flex-basis:100%;padding-left:14px}
.scplan{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}.scplan .btn{align-self:flex-start}
.team{display:flex;flex-direction:column;gap:4px}.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.trow .tn{font-weight:800;min-width:70px}.trow .sp{display:flex;align-items:flex-end;gap:1px;height:18px}.trow .sp i{width:4px;border-radius:1px}
@media (max-width:760px){#scoreWrap{max-height:none}.sctot .big{font-size:30px}}

.shint{display:flex;align-items:center;gap:6px;padding:4px 12px 8px;color:#34d399;font-size:9px;font-weight:600}
.shint .grow{flex:1}
.live{width:5px;height:5px;border-radius:50%;background:#34d399;flex:none}
#stageWrap canvas{display:block}
#cvStage{aspect-ratio:1/1;border-radius:16px;width:100%;height:auto;touch-action:none;background:#080814;border:1px solid var(--line)}
.stagecv{padding:0 12px 8px}
#pStage .mvbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:2px 12px 8px;font-size:10px;font-weight:700;color:#aeb2c9}
#pStage .mvbar>span{color:#c4b5fd}
#pStage .mvbar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
#pStage .stagecv{width:75%;margin:0 auto;padding:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 12px 8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);background:#0c0c1a;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#c7cbe0}
.chip.sel{background:#1a1a3a;border-color:#a78bfa;box-shadow:0 0 0 1px #a78bfa66;color:#fff}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.tile{background:#09091500;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tile span{color:var(--mute);font-size:9px;font-weight:700;display:block}
.tile b{font:700 14px var(--mono);font-variant-numeric:tabular-nums;color:#a5b4fc}
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding:4px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 9px;color:var(--mute);border-radius:6px 6px 0 0;font:700 10px var(--font)}
.tabs button.on{color:#fff;border-bottom-color:var(--accent2);background:#16162f}
.tabbody{padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h3{margin:0;font:800 10px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row>label{color:var(--mute);font-size:10px;font-weight:600}
input[type=number]{width:76px;font-family:var(--mono)}
input[type=color]{width:26px;height:26px;padding:0;border:1px solid var(--line2);border-radius:7px;background:none}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:10px}
.drow{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center;padding:5px;border:1px solid var(--line);border-radius:9px;background:#08081300}
.drow.sel{border-color:#a78bfa;background:#16162f}
.drow .dot{width:14px;height:14px;border-radius:50%;border:2px solid transparent;padding:0}
.drow.sel .dot{border-color:#fff}
.drow .name{width:100%}
.mono{font-family:var(--mono)}
.bar{height:7px;background:#1a1a36;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}
.snap{display:flex;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:9px;background:#08081300}
.snap span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt{width:100%;border-collapse:collapse;font-size:10px}
.tt td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.note{background:#f59e0b14;border:1px solid #f59e0b55;color:#fcd98a;border-radius:9px;padding:8px;font-size:10px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles3 .tile b{font:700 18px var(--display);color:var(--fg)}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px;max-height:90vh}
#modal textarea{min-height:240px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#16162f;border:1px solid #4b50b8;border-radius:10px;padding:7px 14px;z-index:60;font-size:11px;font-weight:600}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* beat bar (reference layout) */
.beatbar{justify-content:space-between;gap:10px 12px;padding:10px 14px}
.bwave{display:flex;align-items:center;gap:8px}

.beats{display:flex;gap:5px}

.nbtn.cur{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:none}

/* permanent text / analysis / history card */
.btabs{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.btnav{display:flex;flex-wrap:wrap;gap:6px}
.btnav button{border:1px solid var(--line2);background:#0e0e1d;color:#aeb2c9;border-radius:9px;padding:7px 12px;font:700 10px var(--font)}
.btnav button.on{background:var(--accent);border-color:var(--accent);color:#fff}

function seek(T){
  R.T=clamp(T,0,Tmax());
  for(const w of ['A','B']){if(!R.real[w])continue;const v=R.vid[w],m=mediaTime(w);if(m>=0&&m<=R.dur[w]){try{v.currentTime=m}catch(e){}}}

}
function play(){
  R.arrMode='play';

  else if(R.T>=Tmax()-.05)seek(S.loop.on?S.loop.in:0);
  R.playing=true;for(const w of['A','B'])R.vid[w].playbackRate=S.rate*(w==='B'?rB():1);syncBtns();
}
function pause(){R.playing=false;for(const w of['A','B'])R.vid[w].pause();syncBtns();}
function togglePlay(){if(R.playing&&!R.solo){pause();return}R.solo=null;if(R.playing)pause();play()}
function soloPlay(w){
  if(R.playing&&R.solo===w){pause();R.solo=null;syncBtns();return}
  if(R.playing)pause();R.solo=w;play();
}
function advance(dt){
  const act=R.solo?[R.solo]:['A','B'];
  let clock=null;for(const w of act)if(R.real[w]&&!R.vid[w].paused&&!R.vid[w].ended&&inRange(w)){clock=w;break}
  if(clock)R.T=clock==='A'?R.vid.A.currentTime+S.shiftA:R.vid.B.currentTime/rB()+S.shiftB;else R.T+=dt*S.rate;
  for(const w of ['A','B']){if(!R.real[w])continue;const v=R.vid[w],m=mediaTime(w);
    if(!act.includes(w)){if(!v.paused)v.pause();continue}
    if(m>=0&&m<=R.dur[w]){if(v.paused&&!v.ended){try{v.currentTime=clamp(m,0,Math.max(0,R.dur[w]-.01))}catch(e){}v.playbackRate=S.rate*(w==='B'?rB():1);v.play().catch(()=>{})}
      else if(w!==clock&&Math.abs(v.currentTime-m)>.12){try{v.currentTime=m}catch(e){}}}
    else if(!v.paused)v.pause();}
  if(R.solo){const w=R.solo;if(mediaTime(w)>=R.dur[w]-.03){pause();R.solo=null;syncBtns();return}}
  if(R.prac&&!R.recording&&pracStep())return;
  if(S.loop.on&&S.loop.out>S.loop.in&&R.T>=S.loop.out){if(R.recording){stopRec();return}seek(S.loop.in);return}
  if(!R.solo&&R.T>=Tmax()-.02){if(R.recording)stopRec();if(S.loop.on)seek(S.loop.in);else{pause();R.T=Tmax()}}
  if(_lastAud!==effAudio().a+''+effAudio().b+S.muted+S.volume)applyAudio();
}

/* ---------- sampling / metrics ---------- */
function metrics(){
  const rows=S.dancers.map(d=>{const a=stagePos('A',d),b=stagePos('B',d);return {id:d.id,a,b,err:Math.hypot(a.u-b.u,a.v-b.v)}});

  return {rows,mean,form,coh};
}
function sampleData(m){
  if(!R.playing)return;const k=Math.round(R.T*10);if(R.samples.has(k)&&R.lastS&&R.lastS.k===k)return;
  const rec={t:k/10,rows:m.rows.map(r=>({id:r.id,au:r.a.u,av:r.a.v,bu:r.b.u,bv:r.b.v,err:r.err})),form:m.form,eA:null,eB:null};
  if(R.lastS&&k-R.lastS.k===1){let sa=0,sb=0;m.rows.forEach(r=>{const p=R.lastS.map[r.id];if(p){sa+=Math.hypot(r.a.u-p[0],r.a.v-p[1])*10;sb+=Math.hypot(r.b.u-p[2],r.b.v-p[3])*10}});rec.eA=sa/(m.rows.length||1);rec.eB=sb/(m.rows.length||1)}
  R.samples.set(k,rec);const map={};m.rows.forEach(r=>map[r.id]=[r.a.u,r.a.v,r.b.u,r.b.v]);R.lastS={k,map};

}

/* ---------- beat helpers ---------- */
function hasGrid(){return S.grid&&S.grid.t&&S.grid.t.length>4}
function gridTimes(){return hasGrid()?S.grid.t:[]}
function beatInfo(){if(hasGrid()){const L=S.grid.t;let a=0,b=L.length-1;if(R.T<L[0]){const bp=60/S.bpm,k=Math.floor((R.T-L[0])/bp);return {idx:k,n:(((k-S.grid.one)%8)+8)%8+1}}if(R.T>=L[b]){const bp=60/S.bpm,k=b+Math.floor((R.T-L[b])/bp);return {idx:k,n:(((k-S.grid.one)%8)+8)%8+1}}
  while(b-a>1){const m=(a+b)>>1;if(L[m]<=R.T)a=m;else b=m}return {idx:a,n:(((a-S.grid.one)%8)+8)%8+1}}
  const bp=60/S.bpm,idx=Math.floor((R.T-S.firstBeat)/bp);return {idx,n:((idx%8)+8)%8+1}}
/* all beat ticks in [lo,hi]: [{t,c}] where c = 0..7 position in the 8-count */
function beatTicks(lo,hi){const o=[];if(hasGrid()){S.grid.t.forEach((x,i)=>{if(x>=lo&&x<=hi)o.push({t:x,c:(((i-S.grid.one)%8)+8)%8})});return o}
  const bp=60/S.bpm;for(let k=Math.ceil((lo-S.firstBeat)/bp);S.firstBeat+k*bp<=hi;k++)o.push({t:S.firstBeat+k*bp,c:((k%8)+8)%8});return o}
function countOnes(lo,hi){return beatTicks(lo,hi).filter(b=>b.c===0).map(b=>b.t)}

/* ---------- reports ---------- */
function perDancerStats(){
  const acc={};for(const s of R.samples.values())for(const r of s.rows){(acc[r.id]=acc[r.id]||[]).push(r.err)}
  return S.dancers.map(d=>{const a=acc[d.id]||[];return {id:d.id,name:d.name,color:d.color,n:a.length,mean:a.length?a.reduce((x,y)=>x+y,0)/a.length:null}});
}
function csvText(){
  const rows=['t,dancer,a_u,a_v,b_u,b_v,error'];const ks=[...R.samples.keys()].sort((a,b)=>a-b);
  for(const k of ks){const s=R.samples.get(k);for(const r of s.rows){const d=S.dancers.find(x=>x.id===r.id);rows.push([s.t.toFixed(1),'"'+(d?d.name:r.id).replace(/"/g,'""')+'"',r.au.toFixed(4),r.av.toFixed(4),r.bu.toFixed(4),r.bv.toFixed(4),r.err.toFixed(4)].join(','))}}
  return rows.join('\n');
}
function reportText(){
  const m=metrics(),st=perDancerStats(),all=st.filter(x=>x.mean!=null);const avg=all.length?all.reduce((s,x)=>s+x.mean,0)/all.length:null;
  return `# K-POP Dance Vision Report\n\nProject: ${S.name}\nExported: ${new Date().toLocaleString()}\n\n## Setup\n- Video A: ${R.real.A?R.name.A:'(demo)'} · start ${S.shiftA}s\n- Video B: ${R.real.B?R.name.B:'(demo)'} · start ${S.shiftB}s\n- BPM ${S.bpm} · first beat ${S.firstBeat}s\n- Tracking: ${S.track?'on':'off'}\n\n## Live metrics (now)\n- Formation match: ${m.form.toFixed(1)}%\n- Cohesion: ${m.coh.toFixed(1)}%\n- Mean position error: ${(m.mean*100).toFixed(2)}% of frame\n\n## Recorded run (${R.samples.size} samples @10Hz)\n- Mean error over run: ${avg==null?'n/a':(avg*100).toFixed(2)+'% of frame'}\n${st.map(x=>`- ${x.name}: ${x.mean==null?'n/a':(x.mean*100).toFixed(2)+'%'} (${x.n} samples)`).join('\n')}\n\n## Dancers\n${S.dancers.map(d=>`- ${d.name} A(${d.a.x.toFixed(3)}, ${d.a.y.toFixed(3)}) B(${d.b.x.toFixed(3)}, ${d.b.y.toFixed(3)})`).join('\n')}\n\n## Snapshots\n${S.snaps.map(s=>`- ${s.label} (${s.time})`).join('\n')||'-'}\n\nNote: positions are normalised to the video frame after mirror/zoom/pan, so align the framing of A and B before comparing.\n`;
}
function addSnap(label){S.snaps.unshift({id:uid(),label:label||('Snapshot '+(S.snaps.length+1)),time:new Date().toLocaleString(),data:snapStr()});S.snaps=S.snaps.slice(0,30);R.dirty=true}

function drawWave(){
  const c=$('#cvWave'),ctx=c.getContext('2d'),W=c.width,H=c.height,e=R.env.A||R.env.B;ctx.clearRect(0,0,W,H);
  if(e){const n=e.n,step=Math.max(1,Math.floor(n/W));ctx.fillStyle='#6366f1';for(let x=0;x<W;x++){let mx=0;for(let i=x*step;i<(x+1)*step&&i<n;i++)if(e.rms[i]>mx)mx=e.rms[i];ctx.fillRect(x,H-mx*H,1,mx*H)}}
  else{ctx.fillStyle='#252a6a';for(let x=0;x<W;x+=3)ctx.fillRect(x,H-6-((x*7)%20),2,6+((x*7)%20))}
  const fx=clamp(S.firstBeat/Math.max(1,Tmax()),0,1)*W;ctx.fillStyle='#ec4899';ctx.fillRect(fx,0,2,H);ctx.fillStyle='#fff';ctx.fillRect(clamp(R.T/Math.max(1,Tmax()),0,1)*W,0,1,H);

function drawChart(){
  const c=$('#cvChart');if(!c)return;const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;if(!r.width)return;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height,span=Math.max(10,Tmax()),X=t_=>6+t_/span*(W-12);
  const bp=60/S.bpm;ctx.strokeStyle='#ffffff22';ctx.lineWidth=1;if((W-12)/span*bp>4)for(const bt of beatTicks(0,span)){const x=X(bt.t);ctx.beginPath();ctx.moveTo(x,H-8);ctx.lineTo(x,H);ctx.stroke()}
  const ks=[...R.samples.keys()].sort((a,b)=>a-b);if(!ks.length){ctx.fillStyle='#8a94a9';ctx.font='12px Inter,sans-serif';ctx.fillText('▶',W/2-4,H/2);return}
  let mxA=1e-6,mxB=1e-6;for(const k of ks){const s=R.samples.get(k);if(s.eA!=null){mxA=Math.max(mxA,s.eA);mxB=Math.max(mxB,s.eB)}}
  ctx.fillStyle='#f8717144';ctx.beginPath();ctx.moveTo(X(ks[0]/10),H-8);for(const k of ks){const s=R.samples.get(k),e=s.rows.length?s.rows.reduce((a,r)=>a+r.err,0)/s.rows.length:0;ctx.lineTo(X(s.t),H-8-clamp(e/.3,0,1)*(H-20))}ctx.lineTo(X(ks[ks.length-1]/10),H-8);ctx.fill();
  const line=(key,mx,col)=>{ctx.strokeStyle=col;ctx.lineWidth=1.4;ctx.beginPath();let on=false;for(const k of ks){const s=R.samples.get(k);if(s[key]==null){on=false;continue}const x=X(s.t),y=H-8-s[key]/mx*(H-20);if(on)ctx.lineTo(x,y);else{ctx.moveTo(x,y);on=true}}ctx.stroke()};
  line('eA',mxA,'#5ab0ff');line('eB',mxB,'#ffb454');
  ctx.strokeStyle='#ff4d8d';ctx.beginPath();ctx.moveTo(X(R.T),0);ctx.lineTo(X(R.T),H);ctx.stroke();
}

const V3={ver:'3.0',legalVer:'2026-11-16'};
const PLANS={

  crew:  {zh:'團體 Crew',en:'Crew',price:{m:590,y:4990},noWm:true,res1080:true,layouts:'all',score:true,dancers:12,cloud:200,credits:200,full:true,team:true,seats:10,cutout:true},

const LAYOUTS={basic:['follow','sbs','tb','ov','as','bs','a1','b1'],mobile:['follow','sbs','tb','ov','ovs','a1','b1'],all:null};
const TRIAL_CREDITS=3;
const ACCT={state:'init',db:null,user:null,uid:null,owner:false,name:'',plan:'free',planDoc:null,preview:null,meta:null,cloud:[],sync:'',syncMsg:'',reqDoc:null,unsub:[]};
const DEVLOCAL=(()=>{try{return location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname)}catch(e){return false}})();
const monthKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const PLAN={
  id(){if(ACCT.owner&&ACCT.preview)return ACCT.preview;if(ACCT.owner)return 'studio';
    if(ACCT.state==='local'&&DEVLOCAL){const p=LS.get('kpdai.devplan');if(p&&PLANS[p])return p}
    const d=ACCT.planDoc;if(d&&PLANS[d.plan]&&(!d.until||d.until>Date.now()))return d.plan;return 'free'},
  def(){return PLANS[PLAN.id()]},
  name(id){const p=PLANS[id||PLAN.id()];return S.lang==='zh'?p.zh:p.en},
  can(k){const p=PLAN.def();if(k==='noWm')return !!p.noWm;if(k==='res1080')return !!p.res1080;if(k==='score')return !!p.score;if(k==='team')return !!p.team;if(k==='full')return !!p.full;if(k==='cutout')return !!p.cutout;return false},
  layoutOK(k){const L=LAYOUTS[PLAN.def().layouts];return !L||L.includes(k)},
  /* AI credits: monthly allowance + bonus granted by the owner + one-time trial, minus what was used this month */
  credits(){const p=PLAN.def(),m=ACCT.meta||{},u=(m.usage&&m.usage.m===monthKey())?(m.usage.ai||0):0,bonus=(ACCT.planDoc&&+ACCT.planDoc.bonus)||0,trial=m.trialUsed?0:TRIAL_CREDITS;
    if(ACCT.owner&&!ACCT.preview)return 9999;return Math.max(0,p.credits+bonus+trial-u)},
  async spend(n){if(ACCT.owner&&!ACCT.preview)return true;const m=ACCT.meta||{};const used=(m.usage&&m.usage.m===monthKey())?(m.usage.ai||0):0;
    const meta=Object.assign({},m,{usage:{m:monthKey(),ai:used+n}});if(PLAN.def().credits===0&&!m.trialUsed&&used+n>=TRIAL_CREDITS)meta.trialUsed=true;
    ACCT.meta=meta;await META.save();renderChip();return true},
  dancersOK(n){const lim=PLAN.def().dancers;if((n??S.dancers.length)<=lim)return true;UPS.open('dancers');return false}};
/* ---------- private per-user meta: consent, onboarding, usage ---------- */
const META={
  local(){try{return JSON.parse(LS.get('kpdai.meta')||'{}')}catch(e){return {}}},
  async load(){let m=META.local();if(ACCT.db&&ACCT.uid){try{const s=await ACCT.db.doc('data/users/'+ACCT.uid+'/meta').get();if(s.exists){const c=s.data();m=Object.assign({},m,c,{usage:mergeUsage(m.usage,c.usage)})}}catch(e){}}ACCT.meta=m;return m},
  async save(){const m=ACCT.meta||{};LS.set('kpdai.meta',JSON.stringify(m));if(!(ACCT.db&&ACCT.uid))return;if(META._w){META._again=true;return}META._w=true;
    try{await ACCT.db.doc('data/users/'+ACCT.uid+'/meta').set(JSON.parse(JSON.stringify(m)))}catch(e){}finally{META._w=false;if(META._again){META._again=false;META.save()}}}};
function mergeUsage(a,b){if(!a)return b;if(!b)return a;if(a.m!==b.m)return a.m>b.m?a:b;return {m:a.m,ai:Math.max(a.ai||0,b.ai||0)}}
/* ---------- account bootstrap ---------- */
async function acctInit(){
  let db=null,user=null;try{if(window.claude&&typeof window.claude.use==='function')[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  if(!db||!user){ACCT.state='local';await META.load();afterAcct();return}
  ACCT.db=db;ACCT.user=user;try{ACCT.uid=await user.id()}catch(e){}try{ACCT.owner=!!user.isOwner()}catch(e){}
  if(!ACCT.uid){ACCT.state='local';await META.load();afterAcct();return}
  try{const ps=await user.profiles([ACCT.uid]);ACCT.name=(ps[ACCT.uid]&&ps[ACCT.uid].name)||''}catch(e){}
  ACCT.state='online';await META.load();
  const to=setTimeout(()=>{if(ACCT.planDoc==null){ACCT.planDoc={};renderChip()}},10000);
  ACCT.unsub.push(db.doc('plans/'+ACCT.uid).onSnapshot(s=>{clearTimeout(to);ACCT.planDoc=s.exists?s.data():{};onPlanChange()},()=>{clearTimeout(to);ACCT.planDoc={};onPlanChange()}));
  ACCT.unsub.push(db.doc('requests/'+ACCT.uid).onSnapshot(s=>{ACCT.reqDoc=s.exists?s.data():null;if($('#v3modal [data-v3m="ups"]'))UPS.render()},()=>{}));
  CLOUD.subscribe();afterAcct()}

/* ---------- cloud projects (one doc per project; videos never leave the device) ---------- */
const CLOUD={
  col(){return ACCT.db.doc('data/users/'+ACCT.uid+'/meta').collection('projects')},
  ok(){return ACCT.state==='online'&&ACCT.db&&ACCT.uid},
  subscribe(){if(!CLOUD.ok())return;ACCT.sync='loading';const to=setTimeout(()=>{if(ACCT.sync==='loading'){ACCT.sync='slow';renderChip()}},10000);
    ACCT.unsub.push(CLOUD.col().onSnapshot(q=>{clearTimeout(to);ACCT.cloud=q.docs.map(d=>{const x=d.data();return {id:d.id,name:x.name,t:x.t,size:x.size,vids:x.vids,ver:x.ver}});if(ACCT.sync==='loading'||ACCT.sync==='slow')ACCT.sync='ok';renderChip();if($('#v3modal [data-v3m="proj"]'))PROJ.render()},
      e=>{clearTimeout(to);ACCT.sync='err';renderChip()}))},
  payload(){const {snaps,...rest}=S;let fmSets=rest.fmSets;const pack=o=>JSON.stringify(o);let s=pack(rest);
    if(s.length>230000&&fmSets){/* too big: keep only the version on screen */rest.fmSets={};s=pack(rest)}
    return s.length>240000?null:s},
  queue(){if(!CLOUD.ok())return;clearTimeout(CLOUD._t);CLOUD._t=setTimeout(CLOUD.push,3500)},
  async push(){if(!CLOUD.ok()||!S.id)return;const body=CLOUD.payload();if(!body){ACCT.sync='big';renderChip();return}
    const h=body.length+':'+hashStr(body);if(CLOUD._last[S.id]===h)return;
    const exists=ACCT.cloud.some(p=>p.id===S.id);if(!exists&&ACCT.cloud.length>=PLAN.def().cloud){ACCT.sync='full';renderChip();return}
    if(CLOUD._busy){CLOUD._again=true;return}CLOUD._busy=true;ACCT.sync='saving';renderChip();
    try{await CLOUD.col().doc(S.id).set({name:S.name||'Project',t:Date.now(),size:body.length,ver:V3.ver,vids:vidMeta(),s:body});CLOUD._last[S.id]=h;ACCT.sync='ok'}
    catch(e){ACCT.sync=e&&e.code==='quota_exceeded'?'quota':'err'}finally{CLOUD._busy=false;renderChip();if(CLOUD._again){CLOUD._again=false;CLOUD.queue()}}},
  _last:{},
  async open(id){const s=await CLOUD.col().doc(id).get();if(!s.exists){toast(t('v3cMissing'));return}const x=s.data();let o;try{o=JSON.parse(x.s)}catch(e){toast(t('v3cBad'));return}
    try{persist()}catch(e){}resetMedia();S=Object.assign(defState(o.name),o);S.id=id;if(!S.formations)S.formations=[];S.snaps=S.snaps||[];ensureSel();R.trk={A:{},B:{}};R.undo=[];R.redo=[];
    CLOUD._last[id]=(x.s.length)+':'+hashStr(x.s);R.relink=x.vids||null;persist();fullRefresh();renderRelink();toast(t('v3cOpened')+' '+S.name)},
  async del(id){try{await CLOUD.col().doc(id).delete();toast(t('v3cDeleted'))}catch(e){toast(t('v3cFail'))}}};

document.addEventListener('click',e=>{const el=e.target.closest('[data-cutact]');if(!el)return;const o=cutS();
  if(el.dataset.cutact==='toggle'){if(!o.on&&!cutReady()){cutPrepare().then(()=>{if(cutReady()){o.on=true;R.cut.prev=null;R.dirty=true;renderTab()}});return}o.on=!o.on;R.cut.prev=null;R.cut.key='';R.dirty=true;renderTab()}
  else if(el.dataset.cutact==='prep')cutPrepare();

    if(!R.recording){S.exportLayout=R.cut.recPrev;R.cut.recPrev=null;return}renderTab();const iv=setInterval(()=>{if(!R.recording){clearInterval(iv);if(R.cut.recPrev!=null){S.exportLayout=R.cut.recPrev;R.cut.recPrev=null}try{syncBtns();renderTab()}catch(e){}}},300)}
  else if(el.dataset.cutact==='png'){const T=cutTo();R.cut.clean=true;try{drawPanel(T,R.m||metrics())}catch(e){}R.cut.clean=false;
    const {rx,ry,rw,rh}=videoRect(T),src=cv[T],c=document.createElement('canvas'),k=Math.max(1,(R.vid[T].videoHeight||rh)/rh);c.width=Math.round(rw*k);c.height=Math.round(rh*k);c.getContext('2d').drawImage(src,rx,ry,rw,rh,0,0,c.width,c.height);
    c.toBlob(b=>{if(b)saveFile(`KPDai_cutout_${cutFrom()}to${T}_${fmtT(R.T).replace(/[:.]/g,'-')}.png`,b,'image/png')},'image/png')}
  else if(el.dataset.cutact==='reset'){pushUndo();Object.assign(o,{dx:0,dy:0,scale:1,alpha:1,side:0,mirror:false});R.dirty=true;renderTab()}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.cut)return;const o=cutS(),k=el.dataset.cut;
  if(['dx','dy','scale','alpha'].includes(k)){o[k]=+el.value/100;const b=el.parentNode.querySelector('b');if(b)b.textContent=el.value+'%';R.dirty=true}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.cut)return;const o=cutS(),k=el.dataset.cut;
  if(k==='from'){o.from=el.value==='A'?'A':'B';o.on=false;R.cut.prev=null;R.cut.key='';R.cut.last=null;R.cut.rect=null;renderTab()}
  else if(k==='src'){o.src=el.value;R.cut.prev=null;R.cut.key=''}else if(k==='mirror')o.mirror=el.checked;else if(k==='side')o.side=+el.value;else if(k==='soft'){o.soft=+el.value;R.cut.key=''}else if(k==='anchor')o.anchor=el.value;R.dirty=true});
